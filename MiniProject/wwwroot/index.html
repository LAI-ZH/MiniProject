<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Royal Crest Clubhouse</title>
    <!-- 引入 Bootstrap 和 字体 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        .hero-section {
            background-image: url('https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            min-height: 600px;
            display: flex;
            align-items: center;
            position: relative;
            border-radius: 12px;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, rgba(10, 15, 30, 0.95) 0%, rgba(10, 15, 30, 0.85) 45%, rgba(10, 15, 30, 0.4) 100%);
            border-radius: 12px;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            line-height: 1.1;
            font-weight: 700;
        }

        .welcome-badge {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fbc02d;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-gold {
            background-color: #fbc02d;
            color: #1a1a1a;
            font-weight: 600;
            border: none;
        }

            .btn-gold:hover {
                background-color: #e0a800;
            }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header class="bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <div class="bg-dark text-warning fw-bold px-2 py-1 rounded" style="font-family: 'Playfair Display';">RC</div>
            <h5 class="mb-0 fw-bold">The Royal Crest</h5>
        </div>
        <div class="fw-bold">Welcome, Sarah Chen (Gold Member)</div>
    </header>

    <main class="container-fluid py-4 px-4">
        <!-- 核心大图区域 -->
        <div class="hero-section shadow-lg">
            <div class="hero-overlay"></div>
            <div class="hero-content position-relative z-1 p-5">
                <div class="welcome-badge d-inline-flex align-items-center gap-2 mb-4 px-3 py-2 rounded-pill">
                    <i class="fa-solid fa-crown text-warning"></i>
                    <span>Welcome, Sarah Chen - Gold Member Privilege</span>
                </div>
                <h1 class="hero-title text-white mb-4">
                    Exceptional Clubhouse<br>Leisure, Reserved<br>with Precision.
                </h1>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-gold d-flex align-items-center gap-2 px-4 py-3 rounded-2">
                        <i class="fa-regular fa-calendar-check"></i> Reserve a Facility
                    </button>
                </div>
            </div>
        </div>

        <!-- 🚀 这里是我们测试连接后端的区域 -->
        <div class="mt-5">
            <h3>Live Facility Availability (From C# Backend)</h3>
            <div id="facilityList" class="row g-4 mt-2">
                <!-- JavaScript 会把数据渲染到这里 -->
                <p class="text-muted">Loading data from API...</p>
            </div>
        </div>
    </main>

    <!-- 核心 JavaScript 逻辑 -->
    <script>
        // 页面加载完成后，自动执行
        document.addEventListener("DOMContentLoaded", function () {
            fetchData();
        });

        // 用 fetch 向你的 C# 后端请求数据
        async function fetchData() {
            try {
                // 注意：请把这里的端口号改成你 Swagger 页面显示的端口号
                const response = await fetch('https://localhost:7213/api/facilities');

                if (response.ok) {
                    const facilities = await response.json();
                    renderFacilities(facilities);
                } else {
                    document.getElementById('facilityList').innerHTML = '<p class="text-danger">Failed to load data. Did you add any facilities in Swagger?</p>';
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('facilityList').innerHTML = '<p class="text-danger">Network error. Is the C# backend running?</p>';
            }
        }

        // 将请求回来的 JSON 数据渲染成 HTML 卡片
        function renderFacilities(facilities) {
            const container = document.getElementById('facilityList');
            container.innerHTML = ''; // 清空 "Loading..."

            if (facilities.length === 0) {
                container.innerHTML = '<p class="text-warning">No facilities found. Go to Swagger -> POST /api/facilities to create one!</p>';
                return;
            }

            facilities.forEach(facility => {
                const card = `
                    <div class="col-md-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body">
                                <h5 class="card-title fw-bold">${facility.name}</h5>
                                <h6 class="card-subtitle mb-2 text-muted">${facility.category}</h6>
                                <p class="card-text">Rate: <strong>$${facility.hourlyRate}/hour</strong></p>
                                <span class="badge ${facility.isAvailable ? 'bg-success' : 'bg-danger'}">
                                    ${facility.isAvailable ? 'Available' : 'Occupied'}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }
    </script>
</body>
</html>
